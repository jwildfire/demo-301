# study-config.yaml — study identity and the domain registry.
#
# Two blocks live here:
#
#   1. Identity. The flat StudyID/StudyName/StudyTitle keys are what the
#      open.gismo engine reads today (og_validate(), og_run(), og_app()); the
#      nested `study:` block is the richer identity shape from the data & config
#      framework design (D-FW7). Both are kept in sync until the engine adopts
#      the nested form.
#
#   2. Domain registry (D-APP7 / D-FW7). A domain is a config entry, not code:
#      a label, the chart bundle that renders it, and the workflow phases that
#      produce its data. Adding a domain is a pull request against this file.
#
# Both domains share 1_mappings — mapping is study-level, and domains are
# lenses over the mapped data.
#
# Both domains now draw from the same four numbered phases: gsm.safety's chart
# workflows moved from `3_reports` to the standard `4_modules` in hub#136, so
# the accidental sort-order clash with gsm.reporting's `3_reporting` is gone.
# The registry still says which phases each domain runs — that is the D-FW5
# "map explicitly in domain config" resolution, and it is now a statement about
# scope rather than a workaround for a naming collision. Inside `4_modules` the
# two lanes are told apart by `meta.Data`: a safety chart workflow names the
# mapped domain it reads, a KRI module report reads the reporting layer and
# names none.

StudyID: DEMO-301
StudyName: "DEMO-301"
StudyTitle: "DEMO-301 — Safety Review"

study:
  id: DEMO-301
  label: "DEMO-301 — Safety Review"
  phase: "Phase 2"
  synthetic: true
  source: "gsm.core example source"

domains:
  safety:
    label: Safety
    charts: safety.viz
    workflows: [1_mappings, 2_metrics, 4_modules]
  rbqm:
    label: RBQM
    charts: gsm.viz
    workflows: [1_mappings, 2_metrics, 3_reporting, 4_modules]
