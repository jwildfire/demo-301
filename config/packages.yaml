  - Gilead-BioStats/gsm.mapping
  - Gilead-BioStats/gsm.kri
  - Gilead-BioStats/gsm.reporting
  # Study-level quality tolerance limits (workflows/2_metrics/qtl*.yaml).
  - Gilead-BioStats/gsm.qtl
  - Gilead-BioStats/workr
  # Safety-domain participant metrics and chart workflows
  # (workflows/2_metrics/ and workflows/4_modules/).
  - jwildfire/gsm.safety
  # The engine itself.
  - jwildfire/open.gismo
