# report_qtl.yaml — gsm.qtl's QTL report module, as snapshotted by this study.
#
# Five edits against the copy in `gsm.qtl/inst/workflow/4_modules/`, recorded
# here rather than in a fork of the package. Two are defects that produce a
# wrong report, one is a portability defect, and two are hardening — the
# difference is stated because only the first three are worth reporting
# upstream as bugs.
#
# Defects:
#
#   1. `invid` added to the SUBJ/STUDCOMP join keys. Both domains carry it -
#      in `gsm.core::lSource` as well as here - so joining on studyid/subjid
#      alone leaves `invid.x`/`invid.y` and the report's by-site charts error
#      with "object 'invid' not found". This halts the render.
#   2. The `!expr` reason-fill replaced with an equivalent query.
#      `yaml::yaml.load()` evaluates `!expr` only when the caller passes
#      `eval.expr = TRUE`, which workr does not, so the expression arrives as
#      the literal string "rlang::expr(ifelse(...))" and is written to
#      `compreas` for every row. The `WHERE compreas != 'Completed/Ongoing'`
#      filter below it then matches everything, so the discontinuation listing
#      silently shows the whole cohort. This one produces a wrong report
#      rather than an error, which is the worse failure.
#   3. `pull` -> `dplyr::pull`. An unqualified step name resolves through the
#      search path, so the step only runs if the caller happened to attach
#      dplyr; open.gismo::og_run() attaches just the gsm packages a phase
#      needs, and the step fails with "Function 'pull' not found". Every other
#      step in this file already names its namespace.
#
# Hardening (not defects - both of these work as shipped):
#
#   4. `names:` -> `name:` on two steps. These run correctly upstream: R's `$`
#      partial matching resolves `lStep$name` to `names`. They are normalized
#      because that is an accident, and it would break the day workr reads the
#      field with `[[`.
#   5. The output directory is created before it is normalized.
#      `normalizePath()` defaults to `mustWork = NA`, so a missing path is a
#      warning and the un-normalized path is passed on - not an error, but not
#      a path the report should be trusting either.
#
meta:
  Type: Report
  ID: report_qtl
  Output: html
  Name: QTL Report
  Description: A report summarizing QTL
  Active: true
spec:
  Mapped_STUDCOMP:
    _all:
      required: true
  Mapped_SUBJ:
    studyid:
      type: character
    subjid:
      type: character
    country:
      type: character
  Mapped_EXCLUSION:
    _all:
      required: true
  Reporting_Results_Longitudinal:
    _all:
      required: true
  Reporting_Groups:
    _all:
      required: true
  Reporting_Metrics:
    _all:
      required: true
steps:
  # add listings
  - output: qtl0001
    name: workr::RunQuery
    params:
      df: Mapped_EXCLUSION
      strQuery: "SELECT * FROM df"
  - output: qtl0001_num
    name: workr::RunQuery
    params:
      df: qtl0001
      strQuery: "SELECT * FROM df WHERE Source != 'Neither'"
  - output: qtl0002_preprocess
    name: dplyr::left_join
    params:
      'x': Mapped_SUBJ
      'y': Mapped_STUDCOMP
      # `invid` is a key, not a duplicate: both domains carry it, and joining
      # on only studyid/subjid leaves `invid.x`/`invid.y`, which the report's
      # by-site bar charts then cannot find.
      'by':
        - 'studyid'
        - 'subjid'
        - 'invid'
  # Upstream fills the blank reasons with a `!expr` mutate. `yaml::yaml.load()`
  # only evaluates `!expr` when the caller passes `eval.expr = TRUE`, which
  # workr does not, so the expression arrives as a literal string and every row
  # is labelled with it. The same normalisation as a query, which needs no
  # evaluation: a participant with no recorded reason completed or is ongoing.
  - output: qtl0002
    name: workr::RunQuery
    params:
      df: qtl0002_preprocess
      strQuery: "SELECT * REPLACE (COALESCE(NULLIF(compreas, ''), 'Completed/Ongoing') AS compreas) FROM df"
  - output: qtl0002_num
    name: workr::RunQuery
    params:
      df: qtl0002
      strQuery: "SELECT * FROM df WHERE compreas != 'Completed/Ongoing'"
  - output: reporting_listings
    names: list
    params:
      'qtl0001': qtl0001
      'qtl0001_num': qtl0001_num
      'qtl0002': qtl0002
      'qtl0002_num': qtl0002_num
  - output: all_reportingResults
    name: workr::RunQuery
    params:
      df: Reporting_Results_Longitudinal
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel = 'Study'
        ORDER BY MetricID
  - output: all_reportingGroups
    name: workr::RunQuery
    params:
      df: Reporting_Groups
      strQuery: |
        SELECT *
        FROM df
        WHERE GroupLevel IN ('Site', 'Study')
  # Define the output directory for the report.
  - output: strSnapshotDate
    name: dplyr::pull
    params:
      .data: Reporting_Results_Longitudinal
      var: SnapshotDate
  - output: strSnapshotDate
    name: max
    params:
      ...: strSnapshotDate
  - output: strOutputDir
    name: file.path
    params:
      outputs: outputs
      SnapshotDate: strSnapshotDate
  - output: created
    name: dir.create
    params:
      path: strOutputDir
      recursive: true
      showWarnings: false
  - output: strOutputDir
    name: normalizePath
    params:
      path: strOutputDir
  - output: strInputPath
    name: system.file
    params:
      ...: "report/Report_QTL.Rmd"
      package: "gsm.qtl"
  - output: lParams
    name: list
    params:
      'dfResults': all_reportingResults
      'dfMetrics': Reporting_Metrics
      'dfGroups': all_reportingGroups
      'lListings': reporting_listings
  - output: Report
    name: gsm.kri::RenderRmd
    params:
      lParams: lParams
      strOutputDir: strOutputDir
      strOutputFile: ID
      strInputPath: strInputPath
