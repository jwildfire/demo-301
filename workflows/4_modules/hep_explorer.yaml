meta:
  Type: Report
  ID: hep_explorer
  Output: html
  Data: Mapped_LB
  Name: Hepatic Safety Explorer Report
  Description: Interactive safety.viz eDISH hepatic safety explorer with Hy's Law quadrants and participant drill-down, over the study's own liver chemistry.
  lSettings:
    id_col: subjid
    measure_col: lbtstnam
    value_col: lbstresn
    unit_col: lbstresu
    normal_col_high: lbstnrhi
    normal_col_low: lbstnrlo
    studyday_col: lb_dy
    visit_col: visnam
    visitn_col: visnum
    measure_values:
      ALT: Alanine Aminotransferase
      AST: Aspartate Aminotransferase
      TB: Bilirubin
      ALP: Alkaline Phosphatase
    filters:
      - value_col: sex
        label: Sex
      - value_col: arm
        label: Treatment Group
      - value_col: invid
        label: Site
    groups:
      - value_col: arm
        label: Treatment Group
      - value_col: sex
        label: Sex
    details:
      - value_col: subjid
        label: Participant ID
      - value_col: arm
        label: Treatment Group
      - value_col: invid
        label: Site
spec:
  dfResults:
    subjid:
      type: character
    lbtstnam:
      type: character
    lbstresn:
      type: numeric
    lbstnrhi:
      type: numeric
    lbstnrlo:
      type: numeric
    lb_dy:
      type: integer
    visnum:
      type: integer
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_HepExplorer
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
