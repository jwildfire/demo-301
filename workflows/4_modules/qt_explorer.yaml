meta:
  Type: Report
  ID: qt_explorer
  Output: html
  Data: Mapped_EG
  Name: QT Safety Explorer Report
  Description: Interactive safety.viz QT/QTc safety explorer with central tendency against the ICH E14 threshold, outlier scatter, and categorical summaries. Change from baseline is the `egchg` the ECG mapping derived.
  lSettings:
    id_col: subjid
    measure_col: egtstnam
    value_col: egstresn
    baseline_col: egbase
    change_col: egchg
    unit_col: egstresu
    arm_col: arm
    placebo_arm: Placebo
    visit_col: visnam
    visitn_col: visnum
    baseline_flag_col: egblfl
    measures:
      - QTcF
      - QTcB
      - Heart Rate
      - PR Interval
      - QRS Duration
    qtc_measures:
      - QTcF
      - QTcB
    start_measure: QTcF
    filters:
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: invid
        label: Site
spec:
  dfResults:
    subjid:
      type: character
    egtstnam:
      type: character
    egstresn:
      type: numeric
    egbase:
      type: numeric
    egchg:
      type: numeric
    visnam:
      type: character
    visnum:
      type: integer
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_QtExplorer
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
