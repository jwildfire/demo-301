meta:
  Type: Analysis
  ID: qtl0001
  GroupLevel: Study
  Abbreviation: IE
  Metric: Inclusion/Exclusion Violation Rate
  Numerator: Number of subjects ineligible
  Denominator: Number of subjects enrolled
  Model: Normal Approximation
  Score: Adjusted Z-Score
  AnalysisType: binary
  # DEMO-301's pre-specified acceptable range. gsm.qtl ships 0.03 with
  # "# insert historical data" beside it: a QTL is a per-study parameter, set
  # from historical data or a registry before the study starts, so a study that
  # snapshots these workflows has to set its own. 4% is this protocol's.
  nPropRate: 0.04
  nNumDeviations: 3
  Active: true
  GenerateRiskSignal: true
spec:
  Mapped_EXCLUSION:
    subjid:
      type: character
    subjectid:
      type: character
    Source:
      type: character
    studyid:
      type: character
    invid:
      type: character
    country:
      type: character
    eligibility_criteria:
      type: character
    ie_violation:
      type: character
steps:
  - output: numerator_df
    name: workr::RunQuery
    params:
      df: Mapped_EXCLUSION
      strQuery: "SELECT * FROM df WHERE Source != 'Neither'"
  - output: Analysis_Input
    name: gsm.core::Input_Rate
    params:
      dfSubjects: Mapped_EXCLUSION
      dfNumerator: numerator_df
      dfDenominator: Mapped_EXCLUSION
      strNumeratorCol: subjectid
      strDenominatorCol: subjectid
      strSubjectCol: subjectid
      strGroupCol: studyid
      strGroupLevel: GroupLevel
      strNumeratorMethod: Count
      strDenominatorMethod: Count
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Summary
    name: gsm.qtl::Analyze_OneSideProp
    params:
      dfTransformed: Analysis_Transformed
      nPropRate: nPropRate
      nNumDeviations: nNumDeviations
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Input: Analysis_Input
      Analysis_Transformed: Analysis_Transformed
      Analysis_Summary: Analysis_Summary
