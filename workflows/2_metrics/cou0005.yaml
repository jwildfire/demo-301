meta:
  Type: Analysis
  ID: cou0005
  GroupLevel: Country
  Abbreviation: LB
  Metric: Grade 3+ Lab Abnormality Rate
  Numerator: Grade 3+ Abnormal Labs Samples
  Denominator: Total Lab Samples
  Model: Normal Approximation
  Score: Adjusted Z-Score
  AnalysisType: binary
  Threshold: "2,3"
  Flag: "0,1,2"
  # Accrual guard, adjusted for the unified raw layer (hub#134). The source
  # study's Raw_LB carried 45 analytes with a bare toxicity grade and no
  # result; DEMO-301's carries a 16-analyte panel with real values, from which
  # the grade is derived. That cut the lab records per site from ~1,600 to
  # ~350, so a numerator guard of 10 grade 3+ results now suppresses seven
  # sites in eight. Guarding on the denominator instead — assess a site's rate
  # once it has 100 lab records — is both the same intent and what the rate
  # KRIs beside it already do.
  AccrualThreshold: 100
  AccrualMetric: Denominator
spec:
  Mapped_SUBJ:
    subjid:
      type: character
    country:
      type: character
  Mapped_LB:
    subjid:
      type: character
    toxgrg_nsv:
      type: character
steps:
  - output: vThreshold
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Threshold
  - output: vFlag
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Flag
  - output: Temp_ABNORMAL
    name: RunQuery
    params:
      df: Mapped_LB
      strQuery: "SELECT * FROM df WHERE toxgrg_nsv IN ('3', '4')"
  - output: Temp_LB
    name: RunQuery
    params:
      df: Mapped_LB
      strQuery: "SELECT * FROM df WHERE toxgrg_nsv IN ('0', '1', '2', '3', '4')"
  - output: Analysis_Input
    name: gsm.core::Input_Rate
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Temp_ABNORMAL
      dfDenominator: Temp_LB
      strSubjectCol: subjid
      strGroupCol: country
      strGroupLevel: GroupLevel
      strNumeratorMethod: Count
      strDenominatorMethod: Count
  - output: Analysis_Transformed
    name: gsm.core::Transform_Rate
    params:
      dfInput: Analysis_Input
  - output: Analysis_Analyzed
    name: Analyze_NormalApprox
    params:
      dfTransformed: Analysis_Transformed
      strType: AnalysisType
  - output: Analysis_Flagged
    name: gsm.core::Flag_NormalApprox
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold
      vFlag: vFlag
      nAccrualThreshold: AccrualThreshold
      strAccrualMetric: AccrualMetric
  - output: Analysis_Summary
    name: gsm.core::Summarize
    params:
      dfFlagged: Analysis_Flagged
  - output: lAnalysis
    name: list
    params:
      ID: ID
      Analysis_Input: Analysis_Input
      Analysis_Transformed: Analysis_Transformed
      Analysis_Analyzed: Analysis_Analyzed
      Analysis_Flagged: Analysis_Flagged
      Analysis_Summary: Analysis_Summary

