# Adverse events, mapped once for both lenses on this study.
#
# The RBQM metrics (kri0001/kri0002, cou0001/cou0002) count rows of this domain
# per participant; the Safety charts (ae_explorer, ae_timelines) draw the same
# rows. Attaching the participant's site, arm and demographics here — rather
# than in either lane — is what lets the two agree: there is one join, and both
# lenses see its result.
#
# The join is an INNER join on purpose. It is the data cleaning step: an event
# recorded against a participant who never enrolled has no denominator to be a
# rate over and no arm to be compared in, so it is dropped here rather than
# silently dropped later by one lane and not the other.
meta:
  Type: Mapped
  ID: AE
  Description: Adverse Event Data Mapping
  Priority: 2
spec:
  Raw_AE:
    studyid:
      type: character
    subjid:
      type: character
    aeseq:
      type: integer
    aeterm:
      type: character
    mdrpt_nsv:
      type: character
    mdrsoc_nsv:
      type: character
    aesev:
      type: character
    aetoxgr:
      type: integer
    aeser:
      type: character
    aerel:
      type: character
    aeongo:
      type: character
    aest_dy:
      type: integer
    aeen_dy:
      type: integer
    aest_dt:
      type: Date
    aeen_dt:
      type: Date
    mincreated_dts:
      type: timestamp
  Mapped_SUBJ:
    subjid:
      type: character
    invid:
      type: character
    country:
      type: character
    arm:
      type: character
    sex:
      type: character
    race:
      type: character
    agerep:
      type: integer
steps:
  - output: Temp_AE_Participant
    name: gsm.core::RunQuery
    params:
      df: Mapped_SUBJ
      strQuery: "SELECT subjid, invid, country, arm, sex, race, agerep FROM df"
  - output: Mapped_AE
    name: dplyr::inner_join
    params:
      x: Raw_AE
      "y": Temp_AE_Participant
      by: subjid
