meta:
  Type: Report
  ID: safety_shift_plot
  Output: html
  Data: Mapped_LB
  Name: Safety Shift Plot Report
  Description: Interactive safety.viz shift plot pairing each participant's baseline laboratory result with their Week 4 result.
  lSettings:
    measure_col: lbtstnam
    value_col: lbstresn
    visit_col: visnam
    visit_order_col: visnum
    id_col: subjid
    unit_col: lbstresu
    filters:
      - value_col: invid
        label: Site
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: arm
        label: Treatment Group
    baseline_visits:
      - Baseline
    comparison_visits:
      - Week 4
spec:
  dfResults:
    subjid:
      type: character
    lbtstnam:
      type: character
    visnam:
      type: character
    visnum:
      type: integer
    lbstresn:
      type: numeric
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_ShiftPlot
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
