meta:
  Type: Report
  ID: safety_delta_delta
  Output: html
  Data: Mapped_LB
  Name: Safety Delta-Delta Report
  Description: Interactive safety.viz delta-delta plot of change from baseline in two laboratory measures, on the study's own visit schedule.
  lSettings:
    measure_col: lbtstnam
    value_col: lbstresn
    id_col: subjid
    visit_col: visnam
    visitn_col: visnum
    measure_x: Alanine Aminotransferase
    measure_y: Aspartate Aminotransferase
    baseline_visits:
      - Baseline
    comparison_visits:
      - Week 4
    add_regression_line: true
    filters:
      - value_col: invid
        label: Site
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: arm
        label: Treatment Group
      - value_col: subjid
        label: Participant ID
spec:
  dfResults:
    subjid:
      type: character
    lbtstnam:
      type: character
    lbstresn:
      type: numeric
    visnam:
      type: character
    visnum:
      type: integer
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_DeltaDelta
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
