meta:
  Type: Report
  ID: ae_explorer
  Output: html
  Data: Mapped_AE
  Name: Adverse Event Explorer Report
  Description: Interactive safety.viz adverse event explorer with per-arm prevalence, between-arm differences, and participant drill-down. Reads the same Mapped_AE rows the Adverse Event Rate KRI counts.
  lSettings:
    id_col: subjid
    major_col: mdrsoc_nsv
    minor_col: mdrpt_nsv
    group_col: arm
    filters:
      - value_col: aesev
        label: Severity
      - value_col: aeser
        label: Serious
      - value_col: aerel
        label: Related
    details:
      - value_col: aeterm
        label: Reported Term
      - value_col: aesev
        label: Severity
      - value_col: aest_dy
        label: Start Day
spec:
  dfResults:
    subjid:
      type: character
    mdrsoc_nsv:
      type: character
    mdrpt_nsv:
      type: character
    aeterm:
      type: character
    aesev:
      type: character
    aeser:
      type: character
    aest_dy:
      type: integer
    arm:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_AeExplorer
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
