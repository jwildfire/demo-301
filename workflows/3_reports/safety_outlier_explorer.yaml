meta:
  Type: Report
  ID: safety_outlier_explorer
  Output: html
  Data: Mapped_LB
  Name: Safety Outlier Explorer Report
  Description: Interactive safety.viz outlier explorer over the study's laboratory results, with the reference range each result was graded against.
  lSettings:
    measure_col: lbtstnam
    value_col: lbstresn
    id_col: subjid
    unit_col: lbstresu
    normal_col_low: lbstnrlo
    normal_col_high: lbstnrhi
    filters:
      - value_col: invid
        label: Site
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: arm
        label: Treatment Group
    groups:
      - value_col: arm
        label: Treatment Group
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: invid
        label: Site
    details:
      - value_col: subjid
        label: Participant ID
      - value_col: visnam
        label: Visit
      - value_col: lbstresn
        label: Result
      - value_col: toxgrg_nsv
        label: CTCAE Grade
      - value_col: arm
        label: Treatment Group
spec:
  dfResults:
    subjid:
      type: character
    lbtstnam:
      type: character
    lbstresn:
      type: numeric
    lbstnrlo:
      type: numeric
    lbstnrhi:
      type: numeric
    toxgrg_nsv:
      type: character
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_OutlierExplorer
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
