meta:
  Type: Report
  ID: ae_timelines
  Output: html
  Data: Mapped_AE
  Name: AE Timelines Report
  Description: Interactive safety.viz adverse-event timelines, one row per participant, on the study days the events were recorded against.
  lSettings:
    id_col: subjid
    seq_col: aeseq
    stdy_col: aest_dy
    endy_col: aeen_dy
    term_col: aeterm
    color:
      value_col: aesev
      label: Severity
    highlight:
      value_col: aeser
      label: Serious Event
      value: Y
    filters:
      - value_col: aeser
        label: Serious Event
      - value_col: aesev
        label: Severity
      - value_col: arm
        label: Treatment Group
      - value_col: invid
        label: Site
      - value_col: subjid
        label: Participant ID
    details:
      - value_col: mdrsoc_nsv
        label: Body System
      - value_col: mdrpt_nsv
        label: Dictionary-Derived Term
    sort_participants: earliest
spec:
  dfResults:
    subjid:
      type: character
    aeseq:
      type: integer
    aeterm:
      type: character
    aesev:
      type: character
    aeser:
      type: character
    aest_dy:
      type: integer
    aeen_dy:
      type: integer
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_AeTimelines
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
