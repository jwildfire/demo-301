meta:
  Type: Report
  ID: safety_histogram
  Output: html
  Data: Mapped_LB
  Name: Safety Histogram Report
  Description: Interactive safety.viz histogram of the study's laboratory results, read from the same Mapped_LB domain the Grade 3+ Lab Abnormality KRI is computed from.
  lSettings:
    measure_col: lbtstnam
    value_col: lbstresn
    id_col: subjid
    unit_col: lbstresu
    normal_col_low: lbstnrlo
    normal_col_high: lbstnrhi
    filters:
      - value_col: invid
        label: Site
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: arm
        label: Treatment Group
      - value_col: subjid
        label: Participant ID
    groups:
      - value_col: arm
        label: Treatment Group
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: invid
        label: Site
    display_normal_range: true
    annotate_bin_boundaries: true
    test_normality: true
    group_by: arm
    compare_distributions: true
spec:
  dfResults:
    subjid:
      type: character
    lbtstnam:
      type: character
    lbstresn:
      type: numeric
    lbstnrlo:
      type: numeric
    lbstnrhi:
      type: numeric
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_Histogram
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
