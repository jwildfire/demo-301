meta:
  Type: Report
  ID: safety_results_over_time
  Output: html
  Data: Mapped_LB
  Name: Safety Results Over Time Report
  Description: Interactive safety.viz results-over-time chart of the study's laboratory results across the scheduled visits.
  lSettings:
    measure_col: lbtstnam
    value_col: lbstresn
    time_col: visnam
    time_order_col: visnum
    id_col: subjid
    unit_col: lbstresu
    filters:
      - value_col: invid
        label: Site
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: arm
        label: Treatment Group
    groups:
      - value_col: arm
        label: Treatment Group
      - value_col: sex
        label: Sex
      - value_col: race
        label: Race
      - value_col: invid
        label: Site
    group_by: arm
spec:
  dfResults:
    subjid:
      type: character
    lbtstnam:
      type: character
    visnam:
      type: character
    visnum:
      type: integer
    lbstresn:
      type: numeric
    arm:
      type: character
    invid:
      type: character
steps:
  - output: strOutputDir
    name: getwd
  - output: lWidget
    name: gsm.safety::Widget_ResultsOverTime
    params:
      dfResults: dfResults
      lSettings: lSettings
  - output: strReportPath
    name: gsm.safety::SaveWidgetReport
    params:
      widget: lWidget
      strOutputDir: strOutputDir
      strOutputFile: ID
