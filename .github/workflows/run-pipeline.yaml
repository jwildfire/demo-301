# run-pipeline.yaml — the weekly Actions lane. It runs, and it publishes.
#
# Status (2026-08-24, demo-301#4). This workflow now runs green end to end and
# writes a snapshot onto the `site` branch. First green run: https://github.com/jwildfire/demo-301/actions/runs/32679109589.
#
# Its previous header said it had never been run, which was true when it was
# written on 2026-07-28 and had become false in the worst direction: it had run
# three times, on 2026-08-03, 08-10 and 08-17, and failed every time. Nobody
# heard any of them. Both halves of that are fixed here — the run, and the not
# hearing. Do not restore a "not yet exercised" caveat to this file; if this
# lane stops working the alarm below says so, and a stale caveat in a header is
# not a substitute for a signal.
#
# There is still a LOCAL lane, and it remains the fast one:
#
#   R -e 'open.gismo::og_validate(".")'
#   R -e 'open.gismo::og_run(".")'
#   R -e 'open.gismo::og_app(".")'
#
# The two are supposed to write the identical static tree (_index.json,
# status.json, manifest.csv, output/{phase}/{workflow}/...). What tells them
# apart on the published site is the snapshot's `package_snapshot` field:
# `local-YYYY-MM-DD` for a local run, `gha-<run id>` for this one.
#
# One difference is real rather than cosmetic. The local lane accumulates each
# run's results under a gitignored history/, which gsm.reporting::CalculateChange
# reads to fill the "since last snapshot" columns. A fresh Actions checkout has
# no history/, so a snapshot published from here has no change columns to show.
#
# Adapted from open.gismo's .github/workflows/run-pipeline.yaml, with two
# deliberate changes:
#   * Public-only. No secrets beyond the built-in GITHUB_TOKEN.
#   * Manifest-install lane. Packages are installed by cloning each repo at the
#     SHA pinned in manifest.csv and running R CMD INSTALL, rather than via
#     pak::pkg_install(). pak resolves GitHub refs through api.github.com,
#     which SSO/SAML-protected orgs reject even for public repos; a plain git
#     clone of a public repo does not hit that path. The clone, the CRAN
#     dependency resolution and the install order all live in
#     scripts/install-manifest.R — see its header for why the obvious
#     one-liners do not work here.
#
# Failures are announced. `report-status` raises a GitHub issue when the run
# fails and closes it when the run recovers, because three red Mondays in a row
# went unnoticed (2026-08-03, 08-10, 08-17) while the only signal was a red
# check on a tab nobody opens. pipeline-watchdog.yaml covers the other half:
# the weeks this workflow does not run at all.

name: Run Pipeline

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the resulting snapshot to the site branch'
        required: false
        type: boolean
        default: true
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  # TEMPORARY (site-contract-gate rehearsal, removed before merge).
  push:
    branches:
      - site-contract-gate

permissions:
  contents: write

concurrency:
  # One pipeline run at a time: snapshot ids are allocated by read-modify-write
  # on the site branch, which races if two runs overlap.
  group: demo-301-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      # TEMPORARY (site-contract-gate rehearsal, removed before merge).
      SITE_BRANCH: ${{ github.ref_name == 'site-contract-gate' && 'site-rehearsal' || 'site' }}
    steps:
      - name: Check out the study repo
        uses: actions/checkout@v4
        with:
          # The publish step pushes to the site branch out of this checkout;
          # a shallow one cannot.
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up pandoc
        # gsm.kri::Report_KRI renders an Rmd; the runner image has no pandoc.
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install the CRAN packages the project's own scripts import
        # scripts/*.R use these directly, independent of any pinned package.
        # Everything the pinned packages themselves need is resolved from their
        # DESCRIPTIONs by install-manifest.R in the next step; this step is here
        # for the ones nothing declares, and for the library cache it keeps.
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::dplyr
            any::purrr
            any::tidyr
            any::rlang
            any::htmlwidgets

      - name: Install the packages pinned in manifest.csv
        # Clones each repo at its pinned SHA, installs the CRAN dependencies the
        # DESCRIPTIONs declare, then installs the pinned packages in dependency
        # order. Doing it in manifest order fails: gsm.reporting is listed
        # before workr and imports it.
        run: Rscript scripts/install-manifest.R . /tmp/pkgsrc

      - name: Validate input data against the mapping specs
        run: Rscript -e 'v <- open.gismo::og_validate("."); print(v); if (any(v$status %in% c("missing", "error"))) stop("Input validation failed.")'

      - name: Run the pipeline
        # Not og_run() directly: og_run() runs the module workflows in
        # workflows/4_modules that read the reporting layer, but not the safety
        # chart workflows beside them (the ones declaring meta.Data).
        # scripts/run-pipeline.R runs both, in the order that leaves
        # status.json describing both.
        run: Rscript scripts/run-pipeline.R .

      - name: Publish the snapshot to the site branch
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$SITE_BRANCH" || true
          # A worktree, not a branch switch: the run's output/ lives in this
          # checkout and publish-snapshot.py copies out of it.
          if git rev-parse --verify "origin/$SITE_BRANCH" >/dev/null 2>&1; then
            git worktree add ../site "origin/$SITE_BRANCH" --detach
            git -C ../site switch -c "$SITE_BRANCH"
          else
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git branch "$SITE_BRANCH" "$(git commit-tree "$EMPTY_TREE" -m 'Start the site branch')"
            git worktree add ../site "$SITE_BRANCH"
          fi
          # Arranges the site branch root (current snapshot, flat) and the
          # ps-NNN/ history directory, and updates snapshots.json.
          # input_data_version names the commit the input/ layer came from;
          # package_snapshot names the environment that produced the artifacts.
          # `gha-` is the counterpart of the local lane's `local-YYYY-MM-DD`, so
          # the provenance chip says which lane built a snapshot without anyone
          # having to look it up.
          python3 scripts/publish-snapshot.py ../site "main-${GITHUB_SHA:0:7}" \
            --package-snapshot "gha-${GITHUB_RUN_ID}" --project-dir .
          # Check the tree before it lands, not after. Pages serves the branch
          # root verbatim, so this commit is the publication; there is no later
          # gate to catch a half-written one. Passing this run's own label makes
          # it an assertion that THIS snapshot was recorded, rather than that
          # some snapshot was.
          # DELIBERATE BREAK (removed in the next commit): take two payload
          # entries back out of the assembled tree, so the gate has something
          # real to refuse. A gate nobody has watched refuse is not a gate.
          rm -f ../site/_index.json
          rm -rf ../site/config
          bash .github/scripts/assert-site-contract.sh ../site "gha-${GITHUB_RUN_ID}"
          git -C ../site add -A
          git -C ../site commit -m "Snapshot from ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID})" \
            || echo "Nothing to publish."
          git -C ../site push origin "$SITE_BRANCH"

  # ---------------------------------------------------------------------------
  # The signal. Three scheduled runs failed before this existed and the only
  # record was a red check in the Actions tab, which is not a place anybody
  # looks on a Monday morning. This raises an assigned GitHub issue on failure —
  # assignment is what turns it into an email — and closes that issue when a
  # run goes green again, so the alarm clears itself rather than becoming noise.
  # ---------------------------------------------------------------------------
  report-status:
    name: Raise or clear the pipeline alarm
    needs: run-pipeline
    if: ${{ always() && needs.run-pipeline.result != 'cancelled' && needs.run-pipeline.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Reading the failing step's name and log out of the run, so the issue
      # carries the error instead of only a link to it.
      actions: read
    steps:
      - name: Check out the alarm script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Raise or clear the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.run-pipeline.result == 'success' && 'success' || 'failure' }}
          ALARM_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/pipeline-alarm.sh
