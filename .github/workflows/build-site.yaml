# build-site.yaml — check what the `site` branch is serving, and deploy it if
# this repository's Pages is ever set up to be deployed by Actions.
#
# WHY IT HAD NEVER RUN, AND WHY ITS TRIGGER WAS A LIE (2026-08-24, demo-301#4).
# Written on 2026-07-28 as a template with a header saying "GitHub Pages is not
# enabled on this repo yet". Running it for the first time falsified that and
# two more things:
#
#   * Pages IS enabled, and has been since 2026-07-28, publishing the `site`
#     branch root verbatim through GitHub's own legacy branch lane. The live
#     site does not depend on this file and never has.
#   * The old single `deploy` job could not have succeeded from anywhere: the
#     `github-pages` environment admits only the `gh-pages` and `site` branches,
#     so the job was rejected before its first step everywhere else, and
#     `configure-pages`/`deploy-pages` require the Pages build type to be
#     `workflow` while this repository's is `legacy`.
#   * `on: push: branches: [site]` could never fire. A push event runs the
#     workflows present in the ref that was pushed, and the `site` branch is the
#     published static tree — it carries no `.github/` at all. The scheduled run
#     of 2026-08-24 07:03 UTC pushed a snapshot to `site` and this workflow did
#     not run, which is how that was found. A trigger that cannot fire is worse
#     than no trigger: it reads, from the file, exactly like a check.
#
# So the trigger is now `workflow_run` on Run Pipeline, which fires from the
# default branch where this file actually lives.
#
# The contract itself has moved to .github/scripts/assert-site-contract.sh, and
# run-pipeline.yaml runs the same script on the assembled tree BEFORE it commits.
# That is the gate that can actually stop a bad publish; this workflow is the
# independent look at what ended up on the branch.
#
# ON MOVING PAGES ONTO ACTIONS, if that is ever wanted: switching the build type
# to `workflow` is necessary but not sufficient. The `github-pages` environment
# would also need `main` added to its deployment branch policies, because
# nothing can ever run from `site` — see above.

name: Build Site

"on":
  workflow_run:
    workflows: ["Run Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-301-pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # No `environment:` here on purpose: an environment with a branch policy
  # rejects the whole job before its first step, which is half of why the
  # previous version was unrunnable. This job has to run wherever it is asked to.
  # ---------------------------------------------------------------------------
  contract:
    name: Assert the site branch is whole
    # A pipeline run that failed published nothing, so there is nothing new to
    # look at; a manual dispatch always runs.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      pages_build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - name: Check out this branch, for the scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the site branch beside it
        # Into a subdirectory, not over the top: the `site` branch carries no
        # .github/, so checking it out at the root would take the script away.
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 1
          path: _site

      - name: Assert the site contract
        run: bash .github/scripts/assert-site-contract.sh _site

      - name: Report what the branch says about itself
        run: |
          set -euo pipefail
          {
            echo "### The site branch"
            echo
            if [ -f _site/snapshots.json ]; then
              echo '```json'
              cat _site/snapshots.json
              echo '```'
            else
              echo "_No snapshots.json on the site branch._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Which lane publishes this site?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          info="$(gh api "repos/$REPO/pages" 2>/dev/null || true)"
          if [ -z "$info" ]; then
            echo "build_type=unknown" >> "$GITHUB_OUTPUT"
            echo "Could not read the Pages configuration; assuming this workflow does not deploy."
            exit 0
          fi
          build_type="$(printf '%s' "$info" | jq -r '.build_type // "unknown"')"
          source_branch="$(printf '%s' "$info" | jq -r '.source.branch // "-"')"
          url="$(printf '%s' "$info" | jq -r '.html_url // "-"')"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### How this site is published"
            echo
            echo "- Pages build type: \`$build_type\`"
            echo "- Source branch: \`$source_branch\`"
            echo "- URL: $url"
            echo
            if [ "$build_type" = "workflow" ]; then
              echo "This workflow deploys it."
            else
              echo "GitHub's legacy branch lane deploys it, straight from \`$source_branch\`. The deploy job below stays skipped; it lights up on its own if Pages is switched to \`workflow\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Dormant unless somebody moves Pages onto Actions, and it will need the
  # environment's branch policy widened to `main` when they do. Kept rather than
  # deleted because a contract check is only a gate if something is gated by it,
  # and this is that something.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: contract
    if: ${{ needs.contract.outputs.pages_build_type == 'workflow' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site branch
        uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 1
          path: _site

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload the branch root, verbatim
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
